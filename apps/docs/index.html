<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nova UI — a colorful, accessible, themeable design system for React." />
    <title>Nova UI</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236d4aff'/%3E%3Cstop offset='.55' stop-color='%230fb5a6'/%3E%3Cstop offset='1' stop-color='%23ff6b57'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3C/svg%3E" />
    <!-- Same logic as getThemeScript("nova-docs-mode"): applies a stored mode before paint. -->
    <script>
      (function () { try { var m = localStorage.getItem("nova-docs-mode"); if (m === "light" || m === "dark") document.documentElement.setAttribute("data-nv-mode", m); } catch (e) {} })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
