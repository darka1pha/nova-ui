name: Release

# Runs only after CI has passed on main, so nothing is versioned or published
# while unit tests, the React 18 job or the Playwright suite (a11y, keyboard,
# visual) are red.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency: release-main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      # The branch (not the tested SHA): changesets/action needs a branch checkout
      # to open the "Version packages" PR. A newer push re-runs CI and this job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Opens a "Version packages" PR from pending changesets; when that PR is
      # merged, publishes the new versions to npm with provenance.
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # setup-node's .npmrc reads the token from NODE_AUTH_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # pnpm 12 reads PNPM_CONFIG_*, not NPM_CONFIG_*: the npm spelling alone
          # never reached `pnpm publish`, so 0.3.x–0.5.0 shipped without provenance.
          # publishConfig.provenance in each package.json covers it too.
          PNPM_CONFIG_PROVENANCE: true
          NPM_CONFIG_PROVENANCE: true
          # @changesets/cli v3 writes what it published here (JSON lines).
          CHANGESETS_OUTPUT: ${{ runner.temp }}/changesets-publish.jsonl
      # changesets/action v1 finds published packages by "New tag:" lines, which
      # @changesets/cli v3 no longer prints, so it pushed no tags and made no
      # GitHub releases. This pushes the tags from the CLI's report, creates the
      # releases from the changelogs, and fails if npm shows no provenance.
      - name: Push tags, create GitHub releases, verify provenance
        run: node scripts/release-tags.mjs --report "${{ runner.temp }}/changesets-publish.jsonl"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
