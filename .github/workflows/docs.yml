name: Docs site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the latest push deploys; a deploy already in progress finishes first.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The docs import @darkalpha/nova-ui from its built dist/, so build the libraries first.
      - run: pnpm build
      - run: pnpm build:docs
      # The site uses relative asset paths and hash routing, so it works from
      # https://<owner>.github.io/<repo>/ or a custom domain without extra config.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
