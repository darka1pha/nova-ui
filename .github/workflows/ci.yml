name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, typecheck, lint, unit tests, install verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Writes the size table to the run summary and fails when an import is
      # over its gzip budget (packages/ui/scripts/size-report.ts).
      - name: Bundle size budget
        run: pnpm size >> "$GITHUB_STEP_SUMMARY"

  react18:
    # The peer range is ^18.2 || ^19, but the workspace develops on 19. Swap React
    # for 18 after the build (types stay on 19) and run the component tests on it.
    name: Unit tests on React 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @darkalpha/nova-ui add -D react@^18.3.1 react-dom@^18.3.1
      - run: node -e "const v=require('react/package.json').version;console.log('react',v);if(!v.startsWith('18.'))process.exit(1)"
        working-directory: packages/ui
      - run: pnpm --filter @darkalpha/nova-ui test

  examples:
    # The examples install the packed tarballs (not the workspace), so building
    # them catches packaging and SSR breaks the unit tests can't see.
    name: Build examples (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [vite-app, next-app]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds both packages, packs them and installs the tarballs into the example.
      - run: node scripts/install-local.mjs examples/${{ matrix.example }}
      - run: npm run build
        working-directory: examples/${{ matrix.example }}

  e2e:
    name: Playwright (a11y, keyboard, visual regression)
    runs-on: ubuntu-latest
    needs: check
    # The official image pins the browser build and system fonts, so screenshots are
    # byte-stable between runs. Keep its tag in step with @playwright/test in apps/docs.
    # Baselines for this image live in e2e/__screenshots__/linux; refresh them with the
    # "Update visual baselines" workflow or `pnpm test:e2e:linux` (Docker) locally.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: apps/docs/playwright-report
