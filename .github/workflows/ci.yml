name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, typecheck, lint, unit tests, install verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Bundle size report
        run: pnpm size >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Playwright (a11y, keyboard, visual regression)
    runs-on: ubuntu-latest
    needs: check
    # The official image pins the browser build and system fonts, so screenshots are
    # byte-stable between runs. Keep its tag in step with @playwright/test in apps/docs.
    # Baselines for this image live in e2e/__screenshots__/linux; refresh them with the
    # "Update visual baselines" workflow or `pnpm test:e2e:linux` (Docker) locally.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/docs/playwright-report
