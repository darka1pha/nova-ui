name: Update visual baselines

# Regenerates the linux Playwright screenshots in the same container the CI e2e job
# uses, and commits them to the branch this workflow was run on. Run it from the
# Actions tab after an intended visual change (or once to seed the baselines).
on:
  workflow_dispatch:

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    name: Regenerate linux screenshots
    runs-on: ubuntu-latest
    # Keep in step with the e2e job in ci.yml and @playwright/test in apps/docs.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @darkalpha/nova-docs exec playwright test visual.spec.ts --update-snapshots=all
      - name: Commit changed baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/docs/e2e/__screenshots__/linux
          if git diff --cached --quiet; then
            echo "Baselines are already up to date." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "test(docs): update linux visual baselines"
            git push
            git show --stat --format= HEAD >> "$GITHUB_STEP_SUMMARY"
          fi
